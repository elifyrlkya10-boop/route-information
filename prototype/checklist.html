<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ekipman Kontrol Listesi</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; font-family: system-ui, sans-serif; background: #111; color: #eee; font-size: 20px; }
  main { max-width: 560px; margin: 0 auto; padding: 16px; }
  header { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
  h1 { font-size: 1.6rem; margin: 12px 0; }
  select, button { font: inherit; border-radius: 14px; border: 0; }
  /* Glove-friendly: every tap target at least 72px tall, generous spacing. */
  select { min-height: 72px; padding: 0 16px; font-size: 1.25rem; background: #333; color: #eee; }
  ul { list-style: none; padding: 0; margin: 16px 0; }
  li { margin: 0 0 14px; }
  .item { display: flex; align-items: center; gap: 18px; width: 100%; min-height: 76px; padding: 14px 18px;
          background: #222; color: #eee; font-size: 1.35rem; text-align: left; cursor: pointer; }
  .item.done { opacity: .55; text-decoration: line-through; }
  .item.current { outline: 4px solid #f90; outline-offset: -4px; }
  .box { flex: none; width: 40px; height: 40px; border-radius: 8px; background: #333;
         display: grid; place-items: center; font-size: 1.6rem; }
  .item.done .box::after { content: "✓"; color: #4c4; font-weight: bold; }
  .actions { display: grid; grid-template-columns: 2fr 1fr; gap: 16px; }
  .actions button { min-height: 80px; padding: 16px; background: #f90; color: #111; font-weight: bold; font-size: 1.4rem; }
  .actions button.secondary { background: #333; color: #eee; }
  #notice { background: #4a3500; color: #ffd27a; border-radius: 12px; padding: 14px 16px; font-size: 1.1rem; margin: 8px 0; }
  #notice:empty { display: none; }
  #notice p { margin: 4px 0; }
  #status { min-height: 1.5em; margin-top: 16px; color: #ccc; font-size: 1.3rem; }
</style>
</head>
<body>
<main>
  <header>
    <h1 id="title"></h1>
    <select id="lang" aria-label="Language">
      <option value="tr">Türkçe</option>
      <option value="en">English</option>
      <option value="el">Ελληνικά</option>
      <option value="es">Español</option>
      <option value="pt">Português</option>
    </select>
  </header>
  <div id="notice" role="status"></div>
  <ul id="list"></ul>
  <div class="actions">
    <button id="start"></button>
    <button id="reset" class="secondary"></button>
  </div>
  <p id="status" aria-live="polite"></p>
</main>
<script>
// Base items: always on the list. `id` is stable and is what gets saved.
const BASE_ITEMS = [
  { id: "intercom", tr: "Telsiz (interkom)", en: "Radio / intercom", el: "Ενδοεπικοινωνία", es: "Intercomunicador", pt: "Intercomunicador" },
  { id: "boots", tr: "Bot", en: "Boots", el: "Μπότες", es: "Botas", pt: "Botas" },
  { id: "jacket", tr: "Ceket", en: "Jacket", el: "Μπουφάν", es: "Chaqueta", pt: "Jaqueta" },
  { id: "helmet", tr: "Kask", en: "Helmet", el: "Κράνος", es: "Casco", pt: "Capacete" },
  { id: "guards", tr: "Dizlikler ve kolluklar", en: "Knee and elbow guards", el: "Επιγονατίδες και επιαγκωνίδες", es: "Rodilleras y coderas", pt: "Joelheiras e cotoveleiras" },
  { id: "bike", tr: "Motor kontrolü: fren, gaz, aynalar", en: "Bike check: brakes, throttle, mirrors", el: "Έλεγχος μηχανής: φρένα, γκάζι, καθρέφτες", es: "Revisión de la moto: frenos, acelerador, espejos", pt: "Checagem da moto: freios, acelerador, espelhos" },
];
// Conditional items: off by default, added via ?ek=yagmur|soguk|sis or window.gearChecklist.addConditional("rain"|"cold"|"fog").
// `before` = id of the base item they are inserted in front of. `spoken` = text read aloud (falls back to `text`).
const CONDITIONAL = {
  rain: {
    id: "rain", before: "bike",
    text: { tr: "Yağmurluk / yağmur kıyafeti", en: "Rain jacket / rain gear", el: "Αδιάβροχο / ρούχα βροχής",
            es: "Chubasquero / traje de lluvia", pt: "Capa de chuva / roupa de chuva" },
    spoken: { tr: "Yağmur bekleniyor. Yağmurluğunu ya da yağmur kıyafetini aldın mı?",
              en: "Rain is expected. Do you have your rain jacket or rain gear?",
              el: "Αναμένεται βροχή. Έχεις μαζί το αδιάβροχο ή τα ρούχα βροχής;",
              es: "Se espera lluvia. ¿Llevas el chubasquero o el traje de lluvia?",
              pt: "Há previsão de chuva. Você está levando a capa ou a roupa de chuva?" },
  },
  cold: {
    id: "cold", before: "jacket",
    text: { tr: "Termal içlik", en: "Thermal base layer", el: "Ισοθερμικά εσώρουχα",
            es: "Capa térmica interior", pt: "Segunda pele térmica" },
    spoken: { tr: "Hava soğuk. Termal içliğini giydin mi?",
              en: "It is cold. Are you wearing your thermal base layer?",
              el: "Κάνει κρύο. Φοράς τα ισοθερμικά εσώρουχα;",
              es: "Hace frío. ¿Llevas puesta la capa térmica interior?",
              pt: "Está frio. Você está usando a segunda pele térmica?" },
  },
  fog: {
    id: "fog", before: "bike",
    text: { tr: "Reflektif yelek / ışıklar açık", en: "Reflective vest / lights on", el: "Ανακλαστικό γιλέκο / φώτα αναμμένα",
            es: "Chaleco reflectante / luces encendidas", pt: "Colete refletivo / faróis acesos" },
    spoken: { tr: "Sis bekleniyor. Reflektif yeleğini giydin mi, ışıkların açık mı?",
              en: "Fog is expected. Are you wearing your reflective vest, and are your lights on?",
              el: "Αναμένεται ομίχλη. Φοράς το ανακλαστικό γιλέκο και είναι αναμμένα τα φώτα;",
              es: "Se espera niebla. ¿Llevas el chaleco reflectante y las luces encendidas?",
              pt: "Há previsão de neblina. Você está com o colete refletivo e os faróis acesos?" },
  },
};
// When several items share the same `before`, they appear in the order of this table (rain, then fog).
// Thresholds (when to add which key) live with the caller (weather module / docs), not here.
// URL values for ?ek= (comma separated; a leading "-" removes). Turkish and English keys both accepted.
const EK_ALIASES = { yagmur: "rain", "yağmur": "rain", rain: "rain",
                     soguk: "cold", "soğuk": "cold", cold: "cold",
                     sis: "fog", fog: "fog" };
// Old saves (before conditional items) stored done/current as indices into this exact order.
const LEGACY_ORDER = ["intercom", "boots", "jacket", "helmet", "guards", "bike"];

let extras = new Set(); // active conditional ids
let ITEMS = [];         // current list: [{ id, text{lang}, spoken{lang} }]
function buildItems() {
  const list = [];
  BASE_ITEMS.forEach(b => {
    Object.keys(CONDITIONAL).forEach(k => {
      const c = CONDITIONAL[k];
      if (extras.has(k) && c.before === b.id) list.push({ id: c.id, text: c.text, spoken: c.spoken });
    });
    const { id, ...text } = b;
    list.push({ id, text, spoken: text });
  });
  ITEMS = list;
}
const ids = () => ITEMS.map(it => it.id);
const UI = {
  tr: { title: "Ekipman Kontrolü", start: "🔊 Sesli başlat", begin: "▶ Başlat", next: "✓ Tamam, sonraki", again: "↻ Yeniden başlat", reset: "Sıfırla",
        done: "Her şey hazır. İyi yolculuklar!", say: "tamam", voice: "tr-TR",
        noTts: "Bu tarayıcı sesli okumayı (speechSynthesis) desteklemiyor.",
        noSr: "Bu tarayıcı ses tanımayı (SpeechRecognition) desteklemiyor.",
        useButtons: "Butonlarla devam edebilirsiniz.",
        noStore: "Durum bu tarayıcıda kaydedilemiyor; yenilemede kaybolur." },
  en: { title: "Gear Check", start: "🔊 Start voice", begin: "▶ Start", next: "✓ OK, next", again: "↻ Start over", reset: "Reset",
        done: "All set. Ride safe!", say: "ok", voice: "en-US",
        noTts: "This browser does not support speech output (speechSynthesis).",
        noSr: "This browser does not support speech recognition (SpeechRecognition).",
        useButtons: "You can continue with the buttons.",
        noStore: "Progress cannot be saved in this browser; it will be lost on reload." },
  el: { title: "Έλεγχος εξοπλισμού", start: "🔊 Έναρξη φωνής", begin: "▶ Έναρξη", next: "✓ Εντάξει, επόμενο", again: "↻ Από την αρχή", reset: "Επαναφορά",
        done: "Όλα έτοιμα. Καλό δρόμο!", say: "εντάξει", voice: "el-GR",
        noTts: "Αυτό το πρόγραμμα περιήγησης δεν υποστηρίζει φωνητική ανάγνωση (speechSynthesis).",
        noSr: "Αυτό το πρόγραμμα περιήγησης δεν υποστηρίζει αναγνώριση φωνής (SpeechRecognition).",
        useButtons: "Μπορείτε να συνεχίσετε με τα κουμπιά.",
        noStore: "Η πρόοδος δεν μπορεί να αποθηκευτεί σε αυτό το πρόγραμμα περιήγησης· θα χαθεί με την ανανέωση." },
  es: { title: "Revisión de equipo", start: "🔊 Iniciar voz", begin: "▶ Iniciar", next: "✓ Listo, siguiente", again: "↻ Empezar de nuevo", reset: "Reiniciar",
        done: "Todo listo. ¡Buen viaje!", say: "listo", voice: "es-ES",
        noTts: "Este navegador no admite la lectura en voz alta (speechSynthesis).",
        noSr: "Este navegador no admite el reconocimiento de voz (SpeechRecognition).",
        useButtons: "Puedes continuar con los botones.",
        noStore: "El progreso no se puede guardar en este navegador; se perderá al recargar." },
  pt: { title: "Checagem de equipamento", start: "🔊 Iniciar voz", begin: "▶ Iniciar", next: "✓ Ok, próximo", again: "↻ Recomeçar", reset: "Reiniciar",
        done: "Tudo pronto. Boa viagem!", say: "ok", voice: "pt-BR",
        noTts: "Este navegador não suporta leitura em voz alta (speechSynthesis).",
        noSr: "Este navegador não suporta reconhecimento de voz (SpeechRecognition).",
        useButtons: "Você pode continuar usando os botões.",
        noStore: "O progresso não pode ser salvo neste navegador; será perdido ao recarregar." },
};
const STORE_KEY = "gear-checklist-v1";
const $ = id => document.getElementById(id);

const HAS_TTS = typeof window.speechSynthesis !== "undefined" && typeof window.SpeechSynthesisUtterance === "function";
const SR = window.SpeechRecognition || window.webkitSpeechRecognition || null;
let storageOk = true;

// --- persistence (never throws) ---
function loadState() {
  try {
    const raw = window.localStorage.getItem(STORE_KEY);
    return raw ? JSON.parse(raw) : null;
  } catch (_) { storageOk = false; return null; }
}
function saveState() {
  try {
    window.localStorage.setItem(STORE_KEY, JSON.stringify({ v: 2, done: [...done], current, finished, lang, extras: [...extras] }));
  } catch (_) { storageOk = false; renderNotice(); }
}
// Reset clears progress and language, but keeps active conditional items (see report / reset()).
function clearState() {
  try {
    if (extras.size) window.localStorage.setItem(STORE_KEY, JSON.stringify({ v: 2, extras: [...extras] }));
    else window.localStorage.removeItem(STORE_KEY);
  } catch (_) { storageOk = false; }
}

let lang = (navigator.language || "tr").slice(0, 2);
if (!UI[lang]) lang = "en";
// done: Set of item ids; current: id of the item being asked, or null.
let done = new Set(), current = null, finished = false, recog = null;

const saved = loadState();
let persistNow = false; // write back once on load if the URL added an item or an old save was migrated
if (saved && typeof saved === "object") {
  if (UI[saved.lang]) lang = saved.lang;
  if (Array.isArray(saved.extras)) saved.extras.forEach(k => { if (CONDITIONAL[k]) extras.add(k); });
}
try {
  const ek = new URLSearchParams(window.location.search).get("ek");
  // "?ek=yagmur" adds, "?ek=-yagmur" removes (also from the save). Applied before the save is read
  // back, so a removed item's tick/current position is dropped too.
  if (ek) ek.split(",").forEach(v => {
    v = v.trim().toLowerCase();
    const remove = v.startsWith("-");
    const k = EK_ALIASES[remove ? v.slice(1) : v];
    if (!k) return;
    if (remove && extras.has(k)) { extras.delete(k); persistNow = true; }
    if (!remove && !extras.has(k)) { extras.add(k); persistNow = true; }
  });
} catch (_) {}
buildItems();
if (saved && typeof saved === "object") {
  // v1 saves used numeric indices into LEGACY_ORDER; v2 saves use ids.
  const toId = x => Number.isInteger(x) ? LEGACY_ORDER[x] : x;
  if (Array.isArray(saved.done)) saved.done.forEach(x => { const id = toId(x); if (ids().includes(id)) done.add(id); });
  const cur = toId(saved.current);
  if (ids().includes(cur)) current = cur;
  finished = saved.finished === true && done.size === ITEMS.length;
  if (saved.v !== 2) persistNow = true;
}
const itemById = id => ITEMS.find(it => it.id === id);

// --- speech (all optional) ---
function speak(text, then) {
  if (!HAS_TTS) { then && then(); return; }
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = UI[lang].voice;
    u.onend = () => then && then();
    u.onerror = () => then && then();
    speechSynthesis.speak(u);
  } catch (_) { then && then(); }
}
function listen() {
  if (!SR) return; // fall back to the button
  try {
    recog && recog.abort();
    recog = new SR();
    recog.lang = UI[lang].voice;
    recog.onresult = e => {
      const heard = e.results[0][0].transcript.toLowerCase();
      if (heard.includes(UI[lang].say)) next();
    };
    recog.onerror = () => {};
    recog.start();
  } catch (_) {}
}
function stopSpeech() {
  try { recog && recog.abort(); } catch (_) {}
  recog = null;
  if (HAS_TTS) { try { speechSynthesis.cancel(); } catch (_) {} }
}

// --- UI ---
function renderNotice() {
  const t = UI[lang];
  const lines = [];
  if (!HAS_TTS) lines.push(t.noTts);
  if (!SR) lines.push(t.noSr);
  if (lines.length) lines.push(t.useButtons);
  if (!storageOk) lines.push(t.noStore);
  const box = $("notice");
  box.innerHTML = "";
  lines.forEach((txt, i) => {
    const p = document.createElement("p");
    p.textContent = txt;
    if (txt === t.noTts) p.id = "notice-tts";
    if (txt === t.noSr) p.id = "notice-sr";
    box.appendChild(p);
  });
}
function render() {
  const t = UI[lang];
  document.documentElement.lang = lang;
  document.title = t.title;
  $("title").textContent = t.title;
  $("lang").value = lang;
  $("start").textContent = finished ? t.again : current !== null ? t.next : (HAS_TTS ? t.start : t.begin);
  $("reset").textContent = t.reset;
  $("list").innerHTML = "";
  ITEMS.forEach((item, i) => {
    const li = document.createElement("li");
    const b = document.createElement("button");
    b.type = "button";
    const id = item.id;
    b.className = "item" + (done.has(id) ? " done" : "") + (id === current ? " current" : "");
    b.setAttribute("aria-pressed", done.has(id) ? "true" : "false");
    b.dataset.index = i;
    b.dataset.id = id;
    b.innerHTML = '<span class="box" aria-hidden="true"></span><span></span>';
    b.lastChild.textContent = item.text[lang];
    b.onclick = () => {
      done.has(id) ? done.delete(id) : done.add(id);
      if (done.size < ITEMS.length) finished = false;
      saveState(); render();
    };
    li.appendChild(b);
    $("list").appendChild(li);
  });
  $("status").textContent = finished ? t.done : current !== null ? itemById(current).text[lang] : "";
  renderNotice();
}
function askCurrent() {
  saveState();
  render();
  speak(itemById(current).spoken[lang], listen);
}
function next() {
  if (finished) { reset(); }
  if (current !== null) done.add(current);
  const nextItem = ITEMS.find(it => !done.has(it.id));
  current = nextItem ? nextItem.id : null;
  if (current === null) {
    finished = true;
    stopSpeech();
    saveState();
    render();
    speak(UI[lang].done);
    return;
  }
  askCurrent();
}
// Reset = "start the check over". It does NOT remove conditional items: they reflect an outside
// condition (e.g. rain forecast), not the rider's progress. Use removeConditional() for that.
function reset() {
  done.clear(); current = null; finished = false;
  stopSpeech();
  clearState();
  render();
}
// --- conditional items API (used by e.g. the weather agent) ---
function addConditional(key) {
  if (!CONDITIONAL[key] || extras.has(key)) return false;
  extras.add(key);
  buildItems();
  finished = false; // a new unchecked item means the list is no longer complete
  saveState(); render();
  return true;
}
function removeConditional(key) {
  if (!extras.has(key)) return false;
  extras.delete(key);
  done.delete(key);
  buildItems();
  if (current === key) {
    // The item being asked disappeared: stop listening so a late "tamam" can't tick another item;
    // the next press of the main button asks the next unchecked item.
    stopSpeech();
    current = null;
    finished = ITEMS.every(it => done.has(it.id));
  }
  saveState(); render();
  return true;
}
window.gearChecklist = {
  addConditional, removeConditional,
  conditionals: () => [...extras],
  available: () => Object.keys(CONDITIONAL),
};
if (persistNow) saveState();
$("start").onclick = next;
$("reset").onclick = reset;
$("lang").onchange = e => { lang = e.target.value; saveState(); render(); };
render();
</script>
</body>
</html>
